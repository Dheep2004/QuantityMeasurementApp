<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #23291f;
            padding: 6px 0 24px 0;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 18px;
            margin-bottom: 22px;
        }

        .input-group {
            flex: 1 1 200px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #8a8578;
            margin-bottom: 10px;
        }

        .value-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #eeeae0;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #23291f;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .value-input:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .unit-select {
            width: 100%;
            padding: 13px;
            border: 2px solid #eeeae0;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            color: #23291f;
            background: #ffffff;
            outline: none;
            cursor: pointer;
        }

        .operator-btn {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: #0d9488;
            color: #ffffff;
            font-size: 19px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 14px;
            box-shadow: 0 6px 14px rgba(13, 148, 136, 0.3);
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .operator-btn:hover {
            background: #0f766e;
            transform: translateY(-1px) rotate(90deg);
        }

        .operator-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .operator-label {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #8a8578;
            margin: -12px 0 18px 0;
            letter-spacing: 1.5px;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 999px;
            background: #0d9488;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 22px;
            box-shadow: 0 8px 18px rgba(13, 148, 136, 0.28);
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .calculate-btn:hover {
            background: #0f766e;
            transform: translateY(-1px);
        }

        .calculate-btn:disabled {
            background: #d4cfc2;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .temp-warning {
            background: #fff8ea;
            color: #92660c;
            border-radius: 14px;
            padding: 13px 18px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 22px;
            display: none;
            border: 1px solid #fde9bd;
        }

        .temp-warning.show {
            display: block;
        }

        .result-card {
            border-left: 5px solid #f59e0b;
            background: #fffaf0;
            border-radius: 16px;
            padding: 20px 22px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .result-card.show {
            display: flex;
        }

        .result-card.error {
            border-left-color: #dc2626;
            background: #fef2f2;
        }

        .result-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #8a8578;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 28px;
            font-weight: 800;
            color: #0d9488;
        }

        .result-value.error {
            color: #dc2626;
            font-size: 16px;
        }

        .result-unit-select {
            padding: 11px 16px;
            border: 2px solid #eeeae0;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            background: #ffffff;
            cursor: pointer;
            outline: none;
            display: none;
        }

        .result-unit-select.show {
            display: block;
        }
    </style>
</head>
<body>

<div class="input-row">

    <div class="input-group">
        <label>VALUE 1</label>
        <input type="number" class="value-input" id="value1" placeholder="0">
        <select class="unit-select" id="unit1"></select>
    </div>

    <button class="operator-btn" id="operatorBtn">+</button>

    <div class="input-group">
        <label>VALUE 2</label>
        <input type="number" class="value-input" id="value2" placeholder="0">
        <select class="unit-select" id="unit2"></select>
    </div>

</div>

<div class="operator-label" id="operatorLabel">ADD</div>

<div class="temp-warning" id="tempWarning">
    Temperature does not support arithmetic operations.
</div>

<button class="calculate-btn" id="calculateBtn">Calculate</button>

<div class="result-card" id="resultCard">
    <div>
        <div class="result-label">RESULT</div>
        <div class="result-value" id="resultValue"></div>
    </div>
    <select class="result-unit-select" id="resultUnitSelect"></select>
</div>

<script src="../js/arithmetic.js"></script>
</body>
</html>
