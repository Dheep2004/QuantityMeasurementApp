<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #23291f;
            padding: 6px 0 24px 0;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            margin-bottom: 22px;
        }

        .input-group {
            flex: 1 1 200px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #8a8578;
            margin-bottom: 10px;
        }

        .value-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #eeeae0;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #23291f;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .value-input:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .unit-select {
            width: 100%;
            padding: 13px;
            border: 2px solid #eeeae0;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            color: #23291f;
            background: #ffffff;
            outline: none;
            cursor: pointer;
        }

        .compare-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 999px;
            background: #0d9488;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 22px;
            box-shadow: 0 8px 18px rgba(13, 148, 136, 0.28);
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .compare-btn:hover {
            background: #0f766e;
            transform: translateY(-1px);
        }

        .result-card {
            border-left: 5px solid #f59e0b;
            background: #fffaf0;
            border-radius: 16px;
            padding: 20px 22px;
            display: none;
        }

        .result-card.show {
            display: block;
        }

        .result-card.error {
            border-left-color: #dc2626;
            background: #fef2f2;
        }

        .result-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #8a8578;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 28px;
            font-weight: 800;
            color: #0d9488;
        }

        .result-value.equal {
            color: #0d9488;
        }

        .result-value.not-equal {
            color: #dc2626;
        }

        .result-value.error {
            color: #dc2626;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="input-row">

    <div class="input-group">
        <label>VALUE 1</label>
        <input type="number" class="value-input" id="value1" placeholder="0">
        <select class="unit-select" id="unit1"></select>
    </div>

    <div class="input-group">
        <label>VALUE 2</label>
        <input type="number" class="value-input" id="value2" placeholder="0">
        <select class="unit-select" id="unit2"></select>
    </div>

</div>

<button class="compare-btn" id="compareBtn">Compare</button>

<div class="result-card" id="resultCard">
    <div class="result-label">RESULT</div>
    <div class="result-value" id="resultValue"></div>
</div>

<script src="../js/comparison.js"></script>
</body>
</html>
